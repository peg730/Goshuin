<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1F324F" />
  <meta name="description" content="收藏日本各地宮、社、寺、院的御朱印" />

  <title>御朱印帳</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./favicon.png" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json" />

  <!-- iOS-specific PWA tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="御朱印帳" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Klee+One:wght@400;600&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Pre-built CSS (only the Tailwind utilities used by this app) -->
  <link rel="stylesheet" href="./styles.css">

  <!-- React via importmap (ES modules from esm.sh) -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?deps=react@18.3.1"
    }
  }
  </script>

  <!-- Babel for in-browser JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    * {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    ::-webkit-scrollbar { display: none; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #F5EFE3;
    }
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      box-sizing: border-box;
    }
    #root {
      height: 100%;
      width: 100%;
    }
    input, textarea, button, select {
      font-family: inherit;
    }
    input::placeholder, textarea::placeholder {
      color: rgba(58, 47, 38, 0.4);
    }
    button {
      user-select: none;
      -webkit-user-select: none;
    }

    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F5EFE3;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .icon {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      background: linear-gradient(135deg, #314869, #14213A);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      margin-bottom: 16px;
    }
    #loading .icon span {
      color: #F5EFE3;
      font-family: "Shippori Mincho", serif;
      font-size: 36px;
      font-weight: 700;
    }
    #loading .text {
      color: #3A2F26;
      font-family: "Shippori Mincho", serif;
      font-size: 14px;
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>
  <!-- Loading screen shown until React mounts -->
  <div id="loading">
    <div class="icon"><span>朱</span></div>
    <div class="text">御朱印帳</div>
  </div>

  <div id="root"></div>

  <!-- App code (JSX, transformed at runtime by Babel) -->
  <script type="text/babel" data-type="module" data-presets="react" src="./app.js"></script>

  <!-- Hide loading once React mounts -->
  <script>
    // Hide loading screen when #root has children (React rendered)
    const loadingEl = document.getElementById('loading');
    const rootEl = document.getElementById('root');
    const observer = new MutationObserver(() => {
      if (rootEl.children.length > 0) {
        loadingEl.classList.add('hidden');
        setTimeout(() => loadingEl.remove(), 500);
        observer.disconnect();
      }
    });
    observer.observe(rootEl, { childList: true });
    // Fallback: hide after 8 seconds regardless
    setTimeout(() => {
      if (loadingEl.parentNode) {
        loadingEl.classList.add('hidden');
        setTimeout(() => loadingEl.remove(), 500);
      }
    }, 8000);
  </script>
</body>
</html>
